[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbg-sentinel"
version = "0.24.0"
description = "Portable event-driven agentic framework: events -> fingerprint -> registry -> auto/LLM/HITL -> disposition -> learning"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "KB Grid" }]
license = { text = "Apache-2.0" }
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = ["pydantic>=2.5", "PyYAML>=6"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "cryptography>=42"]
analytics = ["duckdb>=1.1"]
crewai = ["crewai>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "psycopg[binary]>=3.1", "psycopg-pool>=3.2", "fastapi>=0.110",
       "uvicorn>=0.29", "httpx>=0.27", "ruff>=0.5", "duckdb>=1.1", "playwright>=1.45", "cryptography>=42"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
"sentinel.templates" = ["*.yaml"]
"sentinel.connectors" = ["*.yaml"]
"sentinel.console" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S", "BLE"]
ignore = ["S101", "B008", "UP007", "S311", "E731", "S324", "UP042", "UP031"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "BLE", "E501"]
"examples/*" = ["S", "E501"]
# analytics builds SQL from validated identifiers only (schema, fact names, ints) and quoted literals
"sentinel/analytics.py" = ["S608"]
