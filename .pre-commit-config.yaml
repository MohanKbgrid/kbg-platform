# pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        files: ^sentinel/
        args: [--config, sentinel/pyproject.toml]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: \.(png|svg)$
      - id: check-yaml
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: licence-check
        name: licence files and SPDX headers
        entry: python tools/licence_check.py
        language: system
        pass_filenames: false
      - id: scrub-check
        name: no customer names in public layers (needs KBG_SCRUB_PATTERNS or a patterns file)
        entry: python tools/scrub_check.py --allow-missing
        language: system
        pass_filenames: false
